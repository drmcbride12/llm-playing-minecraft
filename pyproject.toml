[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-playing-minecraft"
version = "0.1.0"
description = "A local LM Studio native API powered Minecraft planning agent that emits safe Baritone actions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "drmcbride12" }
]
keywords = ["minecraft", "baritone", "lmstudio", "llm", "gemma"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.scripts]
llm-playing-minecraft = "llm_playing_minecraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_playing_minecraft = ["profiles/*.json"]
